[project]
name = "tfg-codigo"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "marimo>=0.24.0",
    "matplotlib==3.10.8",
    "more-itertools==11.0.1",
    "numpy==2.4.3",
    "pandas==3.0.2",
    "pyarrow==22.0.0",
    "python-calamine==0.6.2",
    "scipy==1.18.0",
    "statsmodels==0.14.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gwaslib"]

[tool.marimo.runtime]
pythonpath = ["./src"]
